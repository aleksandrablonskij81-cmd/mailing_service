{% extends 'mailing/base.html' %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">🔒 Восстановление пароля</h1>
        <p>Введите email, и мы отправим ссылку для сброса пароля.</p>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
        </form>
    </div>
</div>
{% endblock %}
