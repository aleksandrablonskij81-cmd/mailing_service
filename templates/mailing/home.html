{% extends 'mailing/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
<h1 class="mb-4">📊 Статистика сервиса</h1>

<div class="row">
    <div class="col-md-4 mb-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5 class="card-title">Всего рассылок</h5>
                <p class="card-text display-4">{{ total_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5 class="card-title">Активных рассылок</h5>
                <p class="card-text display-4">{{ active_mailings }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-4 mb-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5 class="card-title">Уникальных получателей</h5>
                <p class="card-text display-4">{{ total_recipients }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
